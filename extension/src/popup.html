<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 290px; margin: 12px; }
  h3 { margin: 0 0 8px; font-size: 15px; }
  #st { margin: 0 0 10px; padding: 6px 8px; border-radius: 6px; background: #f1f1f1; }
  #st.ok { background: #e3f4e8; color: #0a5c26; }
  #st.bad { background: #fbe9e7; color: #8c1d18; }
  label { display: block; margin: 8px 0 2px; }
  input { width: 100%; box-sizing: border-box; padding: 4px 6px; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; padding: 6px; }
  p.hint { color: #555; margin: 10px 0 0; font-size: 12px; }
</style>
</head>
<body>
<h3>Browser MCP</h3>
<div id="st">Checking…</div>
<label for="name">Name of this browser (optional)</label>
<input id="name" placeholder="for example firefox, chrome-work">
<label for="port">Relay port</label>
<input id="port" type="number" min="1024" max="65535">
<label for="token">Pairing token (only for manual pairing)</label>
<input id="token" type="password" placeholder="leave empty to keep the current one" autocomplete="off">
<div class="row">
  <button id="save">Save and connect</button>
  <button id="unpair">Unpair</button>
</div>
<p class="hint">Normal pairing: open the pairing link from <code>node server/cli.js pair</code> in this browser.</p>
<script src="popup.js"></script>
</body>
</html>
